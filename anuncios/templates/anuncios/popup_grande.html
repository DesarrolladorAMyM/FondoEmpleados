{% if anuncios_popup_grandes and not ocultar_popup_grande %}

<style>
  @keyframes pg-entrar {
    0%   { transform: scale(0.85) translateY(30px); opacity: 0; }
    60%  { transform: scale(1.03) translateY(-6px);  opacity: 1; }
    100% { transform: scale(1)    translateY(0);     opacity: 1; }
  }
  @keyframes pgFadeIn { from { opacity:0 } to { opacity:1 } }

  #pg-overlay {
    display: none;
  }
  #pg-overlay.visible {
    display: flex;
    animation: pgFadeIn .3s ease forwards;
  }
  @keyframes pg-flotar {
    0%   { transform: translateY(0px);   box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
    50%  { transform: translateY(-10px); box-shadow: 0 36px 72px rgba(0,0,0,0.35); }
    100% { transform: translateY(0px);   box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
  }

  #pg-box {
    animation: pg-entrar .55s cubic-bezier(0.34,1.56,0.64,1) forwards,
               pg-flotar 3s ease-in-out 0.7s infinite;
  }
  #pg-cerrar {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #e2e8f0;
    color: #0a1628;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: transform .2s ease, background .2s ease;
    line-height: 1;
    font-family: 'Sora', sans-serif;
    z-index: 10001;
  }
  #pg-cerrar:hover {
    transform: scale(1.15) rotate(90deg);
    background: #f1f5f9;
  }

  /* ── Contador regresivo (en el grande) ── */
  #pg-countdown {
    background: linear-gradient(135deg, #0a1628, #1a3a6e);
    color: #fff;
    padding: 10px 16px 12px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-radius: 0 0 16px 16px;
  }
  #pg-countdown-label {
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 6px;
    font-family: 'Sora', sans-serif;
  }
  #pg-countdown-digits {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .pg-cd-block {
    background: rgba(255,255,255,0.13);
    border-radius: 8px;
    padding: 5px 8px;
    min-width: 42px;
  }
  .pg-cd-num {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    display: block;
    font-family: 'Sora', monospace;
  }
  .pg-cd-unit {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    display: block;
    margin-top: 2px;
    font-family: 'Sora', sans-serif;
  }
  .pg-cd-sep {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    color: rgba(255,255,255,0.35);
    margin-bottom: 14px;
  }
  #pg-countdown-expired {
    font-size: 13px;
    color: #ff6b6b;
    font-weight: 700;
    padding: 6px 0;
    display: none;
    font-family: 'Sora', sans-serif;
  }
</style>

<div id="pg-overlay"
     style="position:fixed; inset:0; z-index:9998;
            background:rgba(10,22,40,0.78); backdrop-filter:blur(5px);
            align-items:center; justify-content:center; padding:16px;
            display:none;">

  <div id="pg-box" style="position:relative; max-width:min(700px, 92vw);">

    <button id="pg-cerrar" aria-label="Cerrar">&#x2715;</button>

    {% with a=anuncios_popup_grandes.0 %}
      {% if a.enlace %}
        <a href="{{ a.enlace }}" target="_blank" rel="noopener noreferrer">
          <img src="{{ a.imagen.url }}" alt="Anuncio"
               style="display:block; width:100%; max-height:75vh;
                      border-radius:16px 16px 0 0; object-fit:contain;
                      box-shadow:0 24px 64px rgba(0,0,0,0.5);">
        </a>
      {% else %}
        <img src="{{ a.imagen.url }}" alt="Anuncio"
             style="display:block; width:100%; max-height:75vh;
                    border-radius:16px 16px 0 0; object-fit:contain;
                    box-shadow:0 24px 64px rgba(0,0,0,0.5);">
      {% endif %}
    {% endwith %}

    <div id="pg-countdown">
      <div id="pg-countdown-label">⏳ Tiempo restante para el plazo</div>
      <div id="pg-countdown-digits">
        <div class="pg-cd-block">
          <span class="pg-cd-num" id="pg-cd-d">--</span>
          <span class="pg-cd-unit">días</span>
        </div>
        <span class="pg-cd-sep">:</span>
        <div class="pg-cd-block">
          <span class="pg-cd-num" id="pg-cd-h">--</span>
          <span class="pg-cd-unit">horas</span>
        </div>
        <span class="pg-cd-sep">:</span>
        <div class="pg-cd-block">
          <span class="pg-cd-num" id="pg-cd-m">--</span>
          <span class="pg-cd-unit">min</span>
        </div>
        <span class="pg-cd-sep">:</span>
        <div class="pg-cd-block">
          <span class="pg-cd-num" id="pg-cd-s">--</span>
          <span class="pg-cd-unit">seg</span>
        </div>
      </div>
      <div id="pg-countdown-expired">¡El plazo ha vencido!</div>
    </div>

  </div>
</div>

<script>
  (function() {
    setTimeout(function() {
      var overlay = document.getElementById('pg-overlay');
      if (overlay) {
        overlay.style.display = 'flex';
        void overlay.offsetWidth;
        overlay.classList.add('visible');
      }
    }, 2000);

    function cerrarGrande() {
      var overlay = document.getElementById('pg-overlay');
      if (!overlay) return;
      if (pgCdInterval) clearInterval(pgCdInterval);
      overlay.style.transition = 'opacity .3s ease';
      overlay.style.opacity = '0';
      setTimeout(function() {
        overlay.remove();
        /* Mostrar pequeños SOLO después de cerrar el grande */
        if (typeof window.mostrarAnunciosPequenos === 'function') {
          window.mostrarAnunciosPequenos();
        }
      }, 300);
    }

    document.getElementById('pg-cerrar').addEventListener('click', cerrarGrande);
    document.getElementById('pg-overlay').addEventListener('click', function(e) {
      if (e.target === this) cerrarGrande();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') cerrarGrande();
    });

    var FECHA_LIMITE = new Date('2026-06-10T21:00:00Z');
    var pgCdInterval = null;

    function pad(n) { return String(n).padStart(2, '0'); }

    function tickGrande() {
      var diff = FECHA_LIMITE - new Date();
      if (diff <= 0) {
        document.getElementById('pg-countdown-digits').style.display = 'none';
        document.getElementById('pg-countdown-expired').style.display = 'block';
        clearInterval(pgCdInterval);
        return;
      }
      document.getElementById('pg-cd-d').textContent = pad(Math.floor(diff / 86400000));
      document.getElementById('pg-cd-h').textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById('pg-cd-m').textContent = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById('pg-cd-s').textContent = pad(Math.floor((diff % 60000) / 1000));
    }

    tickGrande();
    pgCdInterval = setInterval(tickGrande, 1000);
  })();
</script>

{% endif %}
